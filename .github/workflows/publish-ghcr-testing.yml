name: Publish Testing image to GHCR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ghcr-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Diego19-hub/QR-asistencia' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      vars.NEXT_PUBLIC_SUPABASE_URL != '' &&
      vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      REGISTRY: ghcr.io
      IMAGE_NAME: diego19-hub/qr-asistencia
    steps:
      - name: Validate Testing build configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" != "https://llxyziffgtqnzlguxhyt.supabase.co" ]]; then
            echo "NEXT_PUBLIC_SUPABASE_URL must target QR-asistencia-testing (llxyziffgtqnzlguxhyt)." >&2
            exit 1
          fi
          if [[ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not configured in GitHub Actions variables." >&2
            exit 1
          fi
          echo "Build configuration targets QR-asistencia-testing."

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux AMD64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Record immutable image reference and digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ github.event.workflow_run.head_sha }}"
          {
            echo "## GHCR Testing image"
            echo "- Platform: \`linux/amd64\`"
            echo "- Tag: \`${image}\`"
            echo "- Digest: \`${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
