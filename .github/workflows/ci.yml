name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:backup-tool:restore-local
      - run: npm run test:reports:lease:local
      - run: npm run test:security:matrix:local
        env:
          QR004_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          QR004_CHROME_NO_SANDBOX: "1"
      - name: Invitation onboarding Auth/HTTP integration (local disposable stack)
        run: npm run test:security:invitation-onboarding:local
        env:
          QR004_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          QR004_CHROME_NO_SANDBOX: "1"
      - run: npm run test:security:rpc-ci:local
      - name: QR-004 Phase 10 residual authorization (59 pgTAP assertions)
        run: npm run test:security:phase10-residual:local
      - name: QR-004 targeted authorization and race integration (local disposable stack)
        run: npm run test:security:authorization-races:local
        env:
          QR004_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          QR004_CHROME_NO_SANDBOX: "1"
      - run: npm run test:e2e
        env:
          QR004_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          QR004_CHROME_NO_SANDBOX: "1"
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
